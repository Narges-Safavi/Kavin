openapi: 3.0.3
info:
  title: KAVIN Booking API
  version: 1.0.0
  description: Gregorian dates, Asia/Tehran local times, prices in Iranian toman.
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/bookings/:
    get:
      operationId: v1_bookings_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: state
        schema:
          enum:
          - upcoming
          - in_progress
          - past
          - cancelled
          type: string
          minLength: 1
        description: |-
          * `upcoming` - upcoming
          * `in_progress` - in_progress
          * `past` - past
          * `cancelled` - cancelled
      - in: query
        name: status
        schema:
          enum:
          - confirmed
          - cancelled
          type: string
          minLength: 1
        description: |-
          * `confirmed` - Confirmed
          * `cancelled` - Cancelled
      tags:
      - v1
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: v1_bookings_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingInput'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/bookings/{id}/:
    get:
      operationId: v1_bookings_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/bookings/{id}/cancel/:
    post:
      operationId: v1_bookings_cancel_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/spaces/:
    get:
      operationId: v1_spaces_list
      parameters:
      - in: query
        name: maxPrice
        schema:
          type: integer
          maximum: 2147483647
          minimum: 0
      - in: query
        name: minCapacity
        schema:
          type: integer
          maximum: 32767
          minimum: 1
      - in: query
        name: ordering
        schema:
          enum:
          - price
          - -price
          - capacity
          - -capacity
          - name
          - -name
          type: string
          minLength: 1
        description: |-
          * `price` - price
          * `-price` - -price
          * `capacity` - capacity
          * `-capacity` - -capacity
          * `name` - name
          * `-name` - -name
      - in: query
        name: search
        schema:
          type: string
          maxLength: 150
      - in: query
        name: type
        schema:
          enum:
          - meeting-room
          - shared-desk
          - private-office
          type: string
          minLength: 1
        description: |-
          * `meeting-room` - اتاق جلسه
          * `shared-desk` - میز اشتراکی
          * `private-office` - دفتر خصوصی
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Space'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/spaces/{id}/:
    get:
      operationId: v1_spaces_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/spaces/{id}/availability/:
    get:
      operationId: v1_spaces_availability_retrieve
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/spaces/{id}/quote/:
    post:
      operationId: v1_spaces_quote_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindowInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WindowInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WindowInput'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
components:
  schemas:
    Auth:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - token
      - user
    Availability:
      type: object
      properties:
        spaceId:
          type: string
        date:
          type: string
          format: date
        timezone:
          type: string
        openingTime:
          type: string
          pattern: ^[0-9]{2}:[0-9]{2}$
          example: '10:30'
        closingTime:
          type: string
          pattern: ^[0-9]{2}:[0-9]{2}$
          example: '10:30'
        slotMinutes:
          type: integer
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
      required:
      - closingTime
      - date
      - openingTime
      - slotMinutes
      - slots
      - spaceId
      - timezone
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        userId:
          type: string
        spaceId:
          type: string
        spaceName:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          pattern: ^[0-9]{2}:[0-9]{2}$
          example: '10:30'
        endTime:
          type: string
          pattern: ^[0-9]{2}:[0-9]{2}$
          example: '10:30'
        guests:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        status:
          $ref: '#/components/schemas/BookingStatusEnum'
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          readOnly: true
        canCancel:
          type: boolean
          readOnly: true
        total:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        createdAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
          nullable: true
      required:
      - canCancel
      - cancelledAt
      - createdAt
      - date
      - endTime
      - guests
      - id
      - spaceId
      - spaceName
      - startTime
      - state
      - total
      - userId
    BookingInput:
      type: object
      properties:
        date:
          type: string
          format: date
        startTime:
          type: string
          pattern: ^[0-9]{2}:[0-9]{2}$
          example: '10:30'
        endTime:
          type: string
          pattern: ^[0-9]{2}:[0-9]{2}$
          example: '10:30'
        guests:
          type: integer
          maximum: 32767
          minimum: 1
        spaceId:
          type: string
          maxLength: 18
          pattern: ^[1-9][0-9]{0,17}$
      required:
      - date
      - endTime
      - guests
      - spaceId
      - startTime
    BookingStatusEnum:
      enum:
      - confirmed
      - cancelled
      type: string
      description: |-
        * `confirmed` - Confirmed
        * `cancelled` - Cancelled
    CurrencyEnum:
      enum:
      - toman
      type: string
      description: '* `toman` - toman'
    Error:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - code
      - detail
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - password
      - username
    PaginatedBookingList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
    Quote:
      type: object
      properties:
        available:
          type: boolean
        price:
          type: integer
        total:
          type: integer
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
      required:
      - available
      - currency
      - price
      - total
    Register:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - password
      - username
    Slot:
      type: object
      properties:
        startTime:
          type: string
          pattern: ^[0-9]{2}:[0-9]{2}$
          example: '10:30'
        endTime:
          type: string
          pattern: ^[0-9]{2}:[0-9]{2}$
          example: '10:30'
        status:
          $ref: '#/components/schemas/SlotStatusEnum'
      required:
      - endTime
      - startTime
      - status
    SlotStatusEnum:
      enum:
      - available
      - booked
      - past
      type: string
      description: |-
        * `available` - available
        * `booked` - booked
        * `past` - past
    Space:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 150
        type:
          $ref: '#/components/schemas/TypeEnum'
        capacity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        price:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Hourly price in toman
        description:
          type: string
        image:
          type: string
          maxLength: 500
        location:
          type: string
          maxLength: 150
        area:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        amenities:
          type: array
          items:
            type: string
          readOnly: true
        tag:
          type: string
          maxLength: 150
      required:
      - amenities
      - area
      - capacity
      - description
      - id
      - location
      - name
      - price
      - type
    StateEnum:
      enum:
      - upcoming
      - in_progress
      - past
      - cancelled
      type: string
      description: |-
        * `upcoming` - upcoming
        * `in_progress` - in_progress
        * `past` - past
        * `cancelled` - cancelled
    TypeEnum:
      enum:
      - meeting-room
      - shared-desk
      - private-office
      type: string
      description: |-
        * `meeting-room` - اتاق جلسه
        * `shared-desk` - میز اشتراکی
        * `private-office` - دفتر خصوصی
    User:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - id
      - username
    WindowInput:
      type: object
      properties:
        date:
          type: string
          format: date
        startTime:
          type: string
          pattern: ^[0-9]{2}:[0-9]{2}$
          example: '10:30'
        endTime:
          type: string
          pattern: ^[0-9]{2}:[0-9]{2}$
          example: '10:30'
        guests:
          type: integer
          maximum: 32767
          minimum: 1
      required:
      - date
      - endTime
      - guests
      - startTime
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
